<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mObywatel — Generator</title>
  <style>
    body { margin: 0; background: #101827; color: white; font-family: Arial, sans-serif; }
    .wrap { max-width: 520px; margin: 0 auto; padding: 24px 16px 80px; }
    .field { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; color: #dbeafe; font-size: 14px; }
    input, select { width: 100%; box-sizing: border-box; padding: 12px 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); color: white; }
    button { width: 100%; padding: 13px; border: none; border-radius: 10px; background: #2563eb; color: white; cursor: pointer; font-weight: 700; }
    .preview { width: 100%; max-height: 180px; object-fit: contain; border-radius: 12px; display: none; margin-top: 8px; }
    .status { margin-top: 10px; font-size: 14px; color: #cbd5e1; }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>Generator danych</h2>

    <div class="field">
      <label>Imię</label>
      <input id="name" value="Jan" />
    </div>

    <div class="field">
      <label>Nazwisko</label>
      <input id="surname" value="Kowalski" />
    </div>

    <div class="field">
      <label>Płeć</label>
      <select id="sex">
        <option value="m">Mężczyzna</option>
        <option value="k">Kobieta</option>
      </select>
    </div>

    <div class="field">
      <label>Data urodzenia</label>
      <input id="birthday" value="1990-01-15" type="date" />
    </div>

    <div class="field">
      <label>PESEL</label>
      <input id="pesel" value="90011502957" maxlength="11" />
    </div>

    <div class="field">
      <label>Seria i numer mDowodu</label>
      <input id="mdow_series" value="MWYC 24561" />
    </div>

    <div class="field">
      <label>Data wydania</label>
      <input id="issue_date" value="14.07.2023" />
    </div>

    <div class="field">
      <label>Termin ważności</label>
      <input id="expiry_date" value="14.07.2028" />
    </div>

    <div class="field">
      <label>Imię ojca</label>
      <input id="father_name" value="Maciej" />
    </div>

    <div class="field">
      <label>Imię matki</label>
      <input id="mother_name" value="Ewa" />
    </div>

    <div class="field">
      <label>Obywatelstwo</label>
      <input id="nationality" value="POLSKIE" />
    </div>

    <div class="field">
      <label>Miejsce urodzenia</label>
      <input id="birthPlace" value="Warszawa" />
    </div>

    <div class="field">
      <label>Kraj urodzenia</label>
      <input id="birth_country" value="Polska" />
    </div>

    <div class="field">
      <label>Adres</label>
      <input id="adress1" value="ul. Chopina 4/56" />
    </div>

    <div class="field">
      <label>Kod pocztowy / nr</label>
      <input id="adress2" value="42-250" />
    </div>

    <div class="field">
      <label>Miasto</label>
      <input id="city" value="Warszawa" />
    </div>

    <div class="field">
      <label>Data zameldowania</label>
      <input id="home_date" value="01.01.2000" />
    </div>

    <div class="field">
      <label>Nazwisko rodowe</label>
      <input id="family_name" value="Kowalski" />
    </div>

    <div class="field">
      <label>Nazwisko rodowe ojca</label>
      <input id="father_family_name" value="Kowalski" />
    </div>

    <div class="field">
      <label>Nazwisko rodowe matki</label>
      <input id="mother_family_name" value="Nowak" />
    </div>

    <div class="field">
      <label>Zdjęcie</label>
      <input id="fileInput" type="file" accept="image/*" />
      <img id="preview" class="preview" alt="podgląd zdjęcia" />
    </div>

    <button id="generateBtn" type="button">Generuj</button>
    <div id="status" class="status"></div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');
    const status = document.getElementById('status');

    fileInput.addEventListener('change', function () {
      const file = this.files && this.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (e) {
        preview.src = e.target.result;
        preview.style.display = 'block';
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('generateBtn').addEventListener('click', function () {
      const fields = [
        'name', 'surname', 'sex', 'birthday', 'pesel', 'mdow_series', 'issue_date', 'expiry_date',
        'father_name', 'mother_name', 'nationality', 'birthPlace', 'birth_country', 'adress1',
        'adress2', 'city', 'home_date', 'family_name', 'father_family_name', 'mother_family_name'
      ];

      const params = [];
      const file = fileInput.files && fileInput.files[0];
      let imageData = '';

      if (file) {
        const reader = new FileReader();
        reader.onload = function (e) {
          imageData = e.target.result;
          for (const field of fields) {
            const value = document.getElementById(field).value || '';
            params.push(`${field}=${encodeURIComponent(value)}`);
          }
          params.push(`image=${encodeURIComponent(imageData)}`);
          location.href = 'card.html?' + params.join('&');
        };
        reader.readAsDataURL(file);
        return;
      }

      for (const field of fields) {
        const value = document.getElementById(field).value || '';
        params.push(`${field}=${encodeURIComponent(value)}`);
      }

      params.push('image=' + encodeURIComponent('https://i.imgur.com/7vHo48p.jpg'));
      location.href = 'card.html?' + params.join('&');
    });
  </script>
</body>
</html>
