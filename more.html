<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mObywatel — Więcej</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }
    .wrap {
      max-width: 480px;
      margin: 0 auto;
      padding: 28px 16px 80px;
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }
    .btn {
      background: #1e293b;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
    }
    .card {
      background: #1f2937;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 12px;
    }
    #appFrame {
      display: none;
      width: 100%;
      min-height: 760px;
      border: none;
      border-radius: 12px;
      margin-top: 16px;
      background: white;
    }
    #appFrame.visible {
      display: block;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <button class="btn" onclick="location.href='index.html'">Wróć</button>
      <h3>Więcej</h3>
    </div>

    <div class="card">Ustawienia</div>
    <div class="card">Język</div>
    <div class="card">Prywatność</div>

    <button class="btn" id="showAppBtn" type="button" style="margin-top:12px;">Zmień hasło</button>

    <iframe id="appFrame" src="app.html"></iframe>
  </div>

  <script>
    const btn = document.getElementById('showAppBtn');
    const frame = document.getElementById('appFrame');

    btn.addEventListener('click', function () {
      frame.classList.add('visible');
      btn.textContent = 'GUI aktywne';
    });
  </script>
</body>
</html>
